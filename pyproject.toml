[project]
name = "newsreader"
version = "0.1.0"
description = "Personal news intelligence platform with AI synthesis"
requires-python = ">=3.12"
dependencies = [
    "feedparser",
    "httpx",
    "trafilatura",
    "readability-lxml",
    "lxml",
    "Jinja2",
    "PyYAML",
    "markupsafe",
    "mcp[cli]",
    # Security pins — transitive via mcp[cli]; keep until mcp bumps its own floor
    "starlette>=1.3.1",       # CVE-2025-*: high; patched in 1.3.1
    "python-multipart>=0.0.31",  # CVE-2025-*: high+low; patched in 0.0.31
    "cryptography>=48.0.1",   # CVE-2025-*: high; patched in 48.0.1
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
newsreader = "main:main"

[tool.setuptools]
packages = ["news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Mypy is not in GitHub CI — runs locally via pre-commit only. Lenient defaults.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true
