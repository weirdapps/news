[project]
name = "newsreader"
version = "0.1.0"
description = "Personal news intelligence platform with AI synthesis"
requires-python = ">=3.12"
dependencies = [
    "feedparser",
    "httpx",
    "trafilatura",
    "readability-lxml",
    "Jinja2",
    "PyYAML",
    "markupsafe",
    "mcp[cli]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
newsreader = "main:main"

[tool.setuptools]
packages = ["news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Mypy is not in GitHub CI — runs locally via pre-commit only. Lenient defaults
# with ignore_errors for modules carrying pre-existing type baseline issues.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["news.storage", "news.processor", "news.fetcher", "main"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true
