[project]
name = "newsreader"
version = "0.1.0"
description = "Personal news intelligence platform with AI synthesis"
requires-python = ">=3.12"
dependencies = [
    "feedparser",
    "httpx",
    "trafilatura",
    "readability-lxml",
    "lxml",
    "Jinja2",
    "PyYAML",
    "markupsafe",
    # mcp 2.x is required, not optional: v2 moved mcp.server.fastmcp.FastMCP to
    # mcp.server.mcpserver.MCPServer, so news/mcp_server.py cannot import on 1.x.
    "mcp[cli]>=2.0.0",
    # Security pins — transitive via mcp[cli]; keep until mcp bumps its own floor
    "starlette>=1.6.0",       # CVE-2025-*: high; patched in 1.3.1
    "python-multipart>=0.0.32",  # CVE-2025-*: high+low; patched in 0.0.31
    "cryptography>=49.0.0",   # CVE-2025-*: high; patched in 48.0.1 (via pyjwt[crypto])
    # pydantic-settings pin dropped: mcp 2.0 removed the dependency along with
    # its MCP_* env-var settings, and nothing here imports it.
    "youtube-transcript-api>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
newsreader = "main:main"

[tool.setuptools]
packages = ["news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 started formatting Python code blocks inside Markdown by default.
# The superpowers plans/specs are generated, point-in-time design artifacts, not
# maintained prose, and their code blocks are illustrative sketches rather than
# real sources, so reformatting them is churn. Mirrors the markdownlint exclude
# in .pre-commit-config.yaml. Hand-written Markdown (README, CLAUDE, SECURITY)
# stays covered.
extend-exclude = ["docs/superpowers/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "E722", "B904"]

# Mypy is not in GitHub CI — runs locally via pre-commit only. Lenient defaults.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true

# PEP 735 dev group — synced by default on `uv sync` / `uv run`, so a fresh
# checkout gets pytest + pytest-asyncio without extra flags. Mirrors the
# [project.optional-dependencies].dev extra above, which CI installs via pip
# (`pip install -e ".[dev]"`); keep the two in sync.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
