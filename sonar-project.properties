# SonarCloud configuration for Python projects

sonar.organization=weirdapps
sonar.projectKey=weirdapps_news
sonar.projectName=news

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.version=3.12

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
#
# config/tickers.yaml is 13,354 lines of ticker data and Sonar counts YAML as
# ncloc, so on its own it was ~45% of this project's footprint against the
# org's 50k free-plan ceiling. It is data, not code, and analysing it yields
# nothing. Same for the lockfile and the plan documents under docs/, and same
# for the two sources.yaml files: they are curated lists of RSS feed URLs, the
# identical "data, not code" case as tickers.yaml, worth ~750 lines between
# them.
#
# coverage.xml is the same trap one step further along: CI writes it before the
# scan, Sonar counts XML as ncloc, and it billed 8,467 lines, 18% of the whole
# org's ceiling, for a file that is not in git and is regenerated every run. It
# stays listed in sonar.python.coverage.reportPaths above; excluding it from
# sources does not stop the coverage sensor reading it.
# .github/** is excluded on evidence, not taste: YAML was billing 3,362
# ncloc across the org and had produced exactly zero issues in any of the
# thirteen projects. On the free plan's 50,000-line ceiling that is 7% of
# the budget for no findings. Re-include it if Sonar's Actions rules ever
# grow teeth.
sonar.exclusions=\
  .github/**,\
  **/tests/**,\
  **/.venv/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/*.egg-info/**,\
  **/dist/**,\
  **/build/**,\
  coverage.xml,\
  **/coverage.xml,\
  config/tickers.yaml,\
  config/sources.yaml,\
  config/stack/sources.yaml,\
  uv.lock,\
  docs/**

# Test exclusions
sonar.test.exclusions=\
  **/tests/**,\
  **/*_test.py,\
  **/test_*.py
