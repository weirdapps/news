name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
# Minimal token scope. Added 2026-09-20: this workflow had no
# permissions: key, so GITHUB_TOKEN arrived with the repository default,
# which on these repos is write across contents, issues, pull-requests and
# more. Nothing here writes anything; it checks out and runs checks.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Safe: ruff is a trusted package from the Python Packaging Authority.
      # Pinned so a ruff release cannot turn master red on its own: 0.16.0 began
      # formatting Markdown code blocks by default and did exactly that.
      # Keep in sync with the ruff rev in .pre-commit-config.yaml.
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Safe: feedparser dependency (sgmllib3k) has no binary wheels, requires source install
      - run: pip install -e ".[dev]"
      - run: pytest
