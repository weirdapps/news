name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Safe: ruff is a trusted package from the Python Packaging Authority.
      # Pinned so a ruff release cannot turn master red on its own: 0.16.0 began
      # formatting Markdown code blocks by default and did exactly that.
      # Keep in sync with the ruff rev in .pre-commit-config.yaml.
      - run: pip install ruff==0.16.1
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Safe: feedparser dependency (sgmllib3k) has no binary wheels, requires source install
      - run: pip install -e ".[dev]"
      - run: pytest
