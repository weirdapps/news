name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud:
    if: ${{ !github.event.repository.private }}
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Full history for SonarCloud blame

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          # Must satisfy pyproject's requires-python (>=3.12) and match ci.yml.
          # On 3.11 the editable install below fails the version check, every
          # fallback in the chain fails the same way, and the `|| true` swallows
          # it -- so pytest died at conftest with "No module named 'news'", no
          # coverage.xml was written, and the quality gate read 0% coverage on
          # new code for what were in fact fully tested changes.
          python-version: '3.12'

      # Safe: feedparser dependency (sgmllib3k) has no binary wheels, requires source install
      - name: Install dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e . 2>/dev/null \
              || pip install -e ".[dev]" 2>/dev/null \
              || pip install -e ".[test]" 2>/dev/null \
              || true
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi
          pip install pytest pytest-cov

      - name: Check for tests
        id: check-tests
        run: |
          if [ -d tests ] || [ -d test ] || [ -d __tests__ ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "::notice::No tests directory found — SonarCloud will scan without coverage"
          fi

      - name: Run tests with coverage
        if: steps.check-tests.outputs.has_tests == 'true'
        continue-on-error: true
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing || true

      # Without this, a failed install or a collection error is indistinguishable
      # from genuinely untested code: the scan just reports 0% and the gate fails
      # for the wrong reason. Annotate loudly rather than fail, since the step
      # above is already best-effort by design.
      - name: Warn if no coverage report was produced
        if: steps.check-tests.outputs.has_tests == 'true' && hashFiles('coverage.xml') == ''
        run: |
          echo "::error::pytest produced no coverage.xml, so SonarCloud will" \
               "report 0% coverage on new code. This is a CI environment" \
               "failure, not untested code. Check the install output above."

      - name: Check for SonarCloud token
        id: check-sonar
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::SONAR_TOKEN not configured — skipping SonarCloud scan"
          fi

      - name: SonarCloud Scan
        if: steps.check-sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
