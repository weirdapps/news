# Stack profile — Pipeline Settings
# Daily AI/dev intelligence at 13:00 Athens

pipeline:
  relevance_threshold: 15
  max_articles_per_category: 10
  max_article_age_hours: 36
  min_article_length_words: 10
  digest_window_hours: 36
  max_digest_articles: 150
  max_articles_per_source: 8
  dedup_hash_chars: 200

email:
  recipient: ${NEWS_STACK_RECIPIENT:-user@example.com}

schedule:
  timezone: Europe/Athens
  runs:
    - "13:00"

storage:
  db_path: ~/SourceCode/news/data/news.db
  run_log_path: ~/SourceCode/news/data/run.log
  archive_dir: ~/SourceCode/news/data/archive
  archive_after_days: 30

synthesis:
  claude_command: ${NEWS_CLAUDE_COMMAND:-claude}
  claude_args:
    - "--print"
    - "--model"
    - "opus"
  # 150, not 300, and the unit timeout is why. This profile's unit is 600s, so the
  # runner's deadline budget is 600 - timeout - 90 (shutdown grace). At 300 that left
  # 210s and decide()'s forward-looking budget test could never fund a retry on any
  # failure shape; at 150 it leaves 360s and a fast error (429, API error, empty,
  # unparseable) gets its second attempt. Measured on the VPS over ~7 weeks: across
  # 589 successful synthesis calls on monitor/market/stack the median was 77s, p95
  # 108s, p99 125s and the maximum ever seen 250s. So 150 costs 4 calls that succeed
  # today (0.68%), and it costs them outright: a call that is slow because the work
  # is slow truncates on the retry too, so those four end in a FALLBACK digest, not
  # in a retried success. What is bought is a funded second attempt on every FAST
  # failure, which today gets none at all. Owner
  # ruling 2026-08-10; full distribution in the Task 7 report. Do not raise this
  # without re-checking the budget arithmetic in main._llm_budget_seconds.
  timeout: 150
  max_retries: 2

scoring:
  company_mention: 0
  greek_banking: 0
  claude_mention: 30
  category_match: 10
  tier_1_bonus: 15
  tier_2_bonus: 10
  tier_3_bonus: 5
  recency_1h: 15
  recency_4h: 12
  recency_12h: 10
  recency_24h: 5
