# Monitor — Source Configuration
# Monitors all mentions of company and competitors

rss_feeds:
  # === COMPANY DIRECT — Google News Alerts ===
  - name: "Company English"
    url: "https://news.google.com/rss/search?q=when:24h+%22Your+Company+Name%22&ceid=US:en&hl=en-US&gl=US"
    category: "company_direct"
    tier: 1
    language: "en"

  # === COMPANY STOCK ===
  - name: "Company Stock News"
    url: "https://news.google.com/rss/search?q=when:24h+%22TICKER%22&ceid=US:en&hl=en-US&gl=US"
    category: "company_stock"
    tier: 1
    language: "en"

  # === SECTOR NEWS ===
  - name: "Industry Sector"
    url: "https://news.google.com/rss/search?q=when:24h+%22your+industry+sector%22&ceid=US:en&hl=en-US&gl=US"
    category: "sector"
    tier: 2
    language: "en"

  # === COMPETITORS ===
  - name: "Competitor 1"
    url: "https://news.google.com/rss/search?q=when:24h+%22Competitor+Name%22&ceid=US:en&hl=en-US&gl=US"
    category: "competitor"
    tier: 2
    language: "en"

  # === REGULATORY ===
  - name: "Regulatory Body"
    url: "https://news.google.com/rss/search?q=when:24h+%22Regulatory+Body+Name%22&ceid=US:en&hl=en-US&gl=US"
    category: "regulatory"
    tier: 2
    language: "en"

  # === PUBLISHER SECTION FEEDS ===
  # A publisher's own section feed carries everything the outlet prints, not just
  # your company. require_mention keeps only articles that name the company, one
  # of its company.entities or a competitor (keywords.yaml). A regulator mention
  # alone does not qualify: full text cites the central bank in passing.
  - name: "Outlet Business Section"
    url: "https://www.example-outlet.com/business/rss"
    category: "sector"
    tier: 2
    language: "en"
    require_mention: true

  # An outlet with no RSS may still publish a Google News sitemap. It carries
  # headlines only, so the body is empty: min_words: 0 keeps it past the gate.
  - name: "Wire Service"
    url: "https://www.example-wire.com/news-sitemap.xml?size=100"
    category: "sector"
    tier: 2
    language: "en"
    format: "news_sitemap"
    require_mention: true
    min_words: 0
    # The sitemap lists only the latest 100 stories: step back by offset until
    # 10 hours ago (the longest gap between two runs), at most 10 pages.
    paging: {mode: "offset", param: "from", step: 100, lookback_hours: 10, max_pages: 10}

  # === PRESS OFFICES ===
  # A newsroom with no RSS that serves JSON. title and link are templates over
  # each item's keys; items_key is found anywhere in the document.
  - name: "Company Press Office"
    url: "https://www.example-company.com/api/press?lang=en"
    category: "company_direct"
    tier: 1
    language: "en"
    format: "json"
    method: "POST"
    body: {"skip": 0, "pageSize": 20}
    items_key: "articles"
    title: "{title}"
    link: "https://www.example-company.com{path}"
    date: "publishedAt"
    min_words: 0

# Add your company-specific RSS feeds, Google News alerts, and monitoring sources here
# Categories: company_direct, company_stock, sector, competitor, regulatory
# Tier 1 = highest priority, Tier 3 = lowest
