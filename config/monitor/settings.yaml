# Monitor — Pipeline Settings

pipeline:
  # Minimum relevance score to include a mention
  relevance_threshold: 10

  # Maximum article age in hours (monitor checks frequently, so shorter window)
  max_article_age_hours: 24

  # Minimum article length in words
  min_article_length_words: 10

  # Hours of articles to include in each monitor report (from DB)
  digest_window_hours: 24

  # Max articles to send to synthesis
  max_digest_articles: 100

  # Max articles per source to preserve diversity
  max_articles_per_source: 10

  # Number of characters to hash for deduplication
  dedup_hash_chars: 200

  # Skip sending if no new mentions since last run
  skip_empty: true

email:
  # Override via NEWS_MONITOR_RECIPIENT env var (or .env file).
  recipient: ${NEWS_MONITOR_RECIPIENT:-user@example.com}

schedule:
  timezone: Europe/Athens
  # Must match launchd plist (com.news.monitor) — bi-hourly during business
  # hours plus midnight catch-up
  runs:
    - "00:00"
    - "08:00"
    - "10:00"
    - "12:00"
    - "14:00"
    - "16:00"
    - "18:00"
    - "20:00"
    - "22:00"

storage:
  db_path: ~/SourceCode/news/data/news.db
  run_log_path: ~/SourceCode/news/data/run.log
  archive_dir: ~/SourceCode/news/data/archive
  archive_after_days: 90

synthesis:
  # Path to claude CLI. Default 'claude' resolves via $PATH.
  # Override with NEWS_CLAUDE_COMMAND env var if you need an absolute path.
  claude_command: ${NEWS_CLAUDE_COMMAND:-claude}
  claude_args:
    - "--print"
    - "--model"
    - "opus"
  # 150, not 300, and the unit timeout is why. This profile's unit is 600s, so the
  # runner's deadline budget is 600 - timeout - 90 (shutdown grace). At 300 that left
  # 210s and decide()'s forward-looking budget test could never fund a retry on any
  # failure shape; at 150 it leaves 360s and a fast error (429, API error, empty,
  # unparseable) gets its second attempt. Measured on the VPS over ~7 weeks: across
  # 589 successful synthesis calls on monitor/market/stack the median was 77s, p95
  # 108s, p99 125s and the maximum ever seen 250s. So 150 costs 4 calls that succeed
  # today (0.68%) -- two monitor, two stack, none market -- and it costs them
  # outright: a call that is slow because the work is slow truncates on the retry
  # too, so those four end in the synthesis-failure path, not in a retried success.
  # On monitor and stack that path sends a ONE-LINE ALERT with the article list
  # deliberately withheld ("send a one-line alert, NOT the unsynthesized dump"), so
  # the reader gets no news at all rather than a degraded digest; on market, which is
  # store-only, the Investment Brief consumes an unsynthesised fallback. What is
  # bought is a funded second attempt on every FAST failure, which today gets none at
  # all. Owner ruling 2026-08-10; full distribution in the Task 7 report. Do not raise
  # this without re-checking the budget arithmetic in main._llm_budget_seconds.
  timeout: 150
  max_retries: 2

# Monitor-specific scoring
scoring:
  # Company direct mention — highest priority
  company_mention: 80

  # Greek banking sector mention
  greek_banking: 40

  # Competitor mention
  competitor_mention: 30

  # Regulatory mention
  regulatory_mention: 35

  # Category match bonus
  category_match: 10

  # Tier bonuses
  tier_1_bonus: 15
  tier_2_bonus: 10
  tier_3_bonus: 5

  # Recency bonuses (more aggressive for hourly monitoring)
  recency_1h: 20
  recency_4h: 15
  recency_12h: 10
  recency_24h: 5
