# Monitor — Pipeline Settings

pipeline:
  # Minimum relevance score to include a mention
  relevance_threshold: 10

  # Maximum article age in hours (monitor checks frequently, so shorter window)
  max_article_age_hours: 24

  # Minimum article length in words
  min_article_length_words: 10

  # Hours of articles to include in each monitor report (from DB)
  digest_window_hours: 24

  # Max articles to send to synthesis
  max_digest_articles: 100

  # Max articles per source to preserve diversity
  max_articles_per_source: 10

  # Number of characters to hash for deduplication
  dedup_hash_chars: 200

  # Skip sending if no new mentions since last run
  skip_empty: true

email:
  # Override via NEWS_MONITOR_RECIPIENT env var (or .env file).
  recipient: ${NEWS_MONITOR_RECIPIENT:-user@example.com}

schedule:
  timezone: Europe/Athens
  # Must match launchd plist (com.news.monitor) — bi-hourly during business
  # hours plus midnight catch-up
  runs:
    - "00:00"
    - "08:00"
    - "10:00"
    - "12:00"
    - "14:00"
    - "16:00"
    - "18:00"
    - "20:00"
    - "22:00"

storage:
  db_path: ~/SourceCode/news/data/news.db
  run_log_path: ~/SourceCode/news/data/run.log
  archive_dir: ~/SourceCode/news/data/archive
  archive_after_days: 90

synthesis:
  # Path to claude CLI. Default 'claude' resolves via $PATH.
  # Override with NEWS_CLAUDE_COMMAND env var if you need an absolute path.
  claude_command: ${NEWS_CLAUDE_COMMAND:-claude}
  claude_args:
    - "--print"
    - "--model"
    - "opus"
  timeout: 300
  max_retries: 2

# Monitor-specific scoring
scoring:
  # Company direct mention — highest priority
  company_mention: 80

  # Greek banking sector mention
  greek_banking: 40

  # Competitor mention
  competitor_mention: 30

  # Regulatory mention
  regulatory_mention: 35

  # Category match bonus
  category_match: 10

  # Tier bonuses
  tier_1_bonus: 15
  tier_2_bonus: 10
  tier_3_bonus: 5

  # Recency bonuses (more aggressive for hourly monitoring)
  recency_1h: 20
  recency_4h: 15
  recency_12h: 10
  recency_24h: 5
