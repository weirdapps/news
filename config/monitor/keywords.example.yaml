# Monitor — Keyword Definitions
# Used for entity detection, relevance filtering, and classification

# Primary entity — all variants of company name
company:
  names:
    - "Your Company Name"
  stock_symbols:
    - "TICKER"
  # Phrases that look like company name but are NOT (false positive filters)
  false_positives: []
  # Key people
  leadership: []
  # Key products and business lines
  products: []

# Competitors
competitors:
  piraeus:
    names:
      - "Piraeus Bank"
      - "Piraeus Financial Holdings"
      - "Τράπεζα Πειραιώς"
      - "Πειραιώς"
    symbols:
      - "TPEIR.AT"
      - "BPIRY"
  alpha:
    names:
      - "Alpha Bank"
      - "Alpha Services and Holdings"
      - "Alpha Services"
      - "Alpha Τράπεζα"
    symbols:
      - "ALPHA.AT"
  eurobank:
    names:
      - "Eurobank"
      - "Eurobank Ergasias"
      - "Eurobank Holdings"
    symbols:
      - "EUROB.AT"

# Regulatory bodies
regulators:
  - "Bank of Greece"
  - "Τράπεζα της Ελλάδος"
  - "ECB"
  - "European Central Bank"
  - "SSM"
  - "Single Supervisory Mechanism"
  - "Hellenic Capital Market Commission"
  - "Επιτροπή Κεφαλαιαγοράς"
  - "HFSF"
  - "Hellenic Financial Stability Fund"
  - "ΤΧΣ"

# Monitor categories (different from digest categories)
categories:
  company_direct:
    display_name: "Company Direct Mentions"
    priority: 1
  company_stock:
    display_name: "Company Stock & Market"
    priority: 2
  regulatory:
    display_name: "Regulatory & Compliance"
    priority: 3
  sector:
    display_name: "Greek Banking Sector"
    priority: 4
  competitor:
    display_name: "Competitor Watch"
    priority: 5

display_order:
  - company_direct
  - company_stock
  - regulatory
  - sector
  - competitor
