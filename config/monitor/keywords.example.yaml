# Monitor — Keyword Definitions and Display Labels
# Used for brand identity, entity detection, relevance filtering, and classification

display:
  full_name: "Your Company Full Name"   # used in prompt opening, e.g. "monitoring <full_name>"
  short_name: "YourCo"                  # used in repeated prompt references and "<short_name> MENTIONS" header
  monitor_label: "BRAND MONITOR"        # email banner badge text — convention is ALL CAPS
  ticker_primary: "TICKER"              # primary stock symbol with exchange suffix, e.g. "AAPL", "ETE.AT"

# Primary entity — all variants of company name.
# Names match as whole words, ignoring case, accents and final sigma, so list
# each inflected form the press uses (e.g. a Greek genitive) but not each casing.
company:
  names:
    - "Your Company Name"
  stock_symbols:
    - "TICKER"
  # Phrases that look like company name but are NOT (false positive filters)
  false_positives: []
  # Key people
  leadership: []
  # Group entities (subsidiaries, joint ventures). A mention of any of them
  # counts as a company mention in scoring and in the synthesis prompt. Products
  # and brands that are not legal entities do not belong here.
  entities:
    your_asset_management:
      names:
        - "Your Company Asset Management"

# Competitors. A competitor may list false_positives: phrases that share its name
# but are not it (a software product, a car model); they are cut out before its
# names are matched.
competitors:
  piraeus:
    names:
      - "Piraeus Bank"
      - "Piraeus Financial Holdings"
      - "Τράπεζα Πειραιώς"
      - "Πειραιώς"
    symbols:
      - "TPEIR.AT"
      - "BPIRY"
  alpha:
    names:
      - "Alpha Bank"
      - "Alpha Services and Holdings"
      - "Alpha Services"
      - "Alpha Τράπεζα"
    symbols:
      - "ALPHA.AT"
  eurobank:
    names:
      - "Eurobank"
      - "Eurobank Ergasias"
      - "Eurobank Holdings"
    symbols:
      - "EUROB.AT"

# Phrases for a story about your sector as a whole, which names no single
# company. They earn scoring.sector_mention and open the require_mention gate.
sector_terms:
  - "your industry sector"

# Regulatory bodies. A mention earns settings.yaml scoring.regulatory_mention.
regulators:
  - "Bank of Greece"
  - "Τράπεζα της Ελλάδος"
  - "ECB"
  - "European Central Bank"
  - "SSM"
  - "Single Supervisory Mechanism"
  - "Hellenic Capital Market Commission"
  - "Επιτροπή Κεφαλαιαγοράς"
  - "HFSF"
  - "Hellenic Financial Stability Fund"
  - "ΤΧΣ"

# Monitor categories (different from digest categories)
categories:
  company_direct:
    display_name: "Company Direct Mentions"
    priority: 1
  company_stock:
    display_name: "Company Stock & Market"
    priority: 2
  regulatory:
    display_name: "Regulatory & Compliance"
    priority: 3
  sector:
    display_name: "Greek Banking Sector"
    priority: 4
  competitor:
    display_name: "Competitor Watch"
    priority: 5

display_order:
  - company_direct
  - company_stock
  - regulatory
  - sector
  - competitor
