  crypto:
    display_name: "Crypto"
    keywords:
      - bitcoin
      - ethereum
      - crypto
      - cryptocurrency
      - stablecoin
      - digital asset
      - ETF flows
      - blockchain
    priority: 5

  greece_athex:
    display_name: "Greece & ATHEX"
    keywords:
      - Greece
      - Greek
      - ATHEX
      - Athens Stock Exchange
      - National Bank of Greece
      - Piraeus Bank
      - Alpha Bank
      - Eurobank
      - Greek bonds
      - Greek economy
      - Hellenic
