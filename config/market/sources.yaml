# Market profile — sources
# Curated market-moving feeds: broad markets/macro + commodities/crypto +
# Greece/ATHEX. Ticker tagging (config/tickers.yaml) surfaces holdings-specific
# items at query time (recent_for_tickers). TipRanks NEWS is included via Google
# News (site-scoped). NB: TipRanks *structured* data (ratings/catalysts) is a
# separate API path and is NOT ingested here (no VPS API key) — flagged for later.

rss_feeds:
  # === BROAD MARKETS (tier 1) ===
  - name: "Reuters Business"
    url: "https://news.google.com/rss/search?q=when:18h+site:reuters.com/business&ceid=US:en&hl=en-US&gl=US"
    category: "equities"
    tier: 1
    language: "en"
  - name: "Bloomberg via Google"
    url: "https://news.google.com/rss/search?q=when:18h+site:bloomberg.com&ceid=US:en&hl=en-US&gl=US"
    category: "equities"
    tier: 1
    language: "en"
  - name: "WSJ via Google"
    # feeds.a.dj.com stopped updating in Jan 2025: it still answers 200 with the
    # same 20 items, which the age gate drops, so it failed silently for 20 months.
    url: "https://news.google.com/rss/search?q=when:18h+(site:wsj.com/finance+OR+site:wsj.com/economy+OR+site:wsj.com/business+OR+site:wsj.com/markets)&ceid=US:en&hl=en-US&gl=US"
    category: "equities"
    tier: 1
    language: "en"
  - name: "CNBC Top News"
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
    category: "equities"
    tier: 1
    language: "en"
  - name: "CNBC Markets"
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"
    category: "equities"
    tier: 1
    language: "en"
  - name: "MarketWatch Top Stories"
    url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
    category: "equities"
    tier: 1
    language: "en"
  - name: "Yahoo Finance"
    # news/rssindex has answered 404 since 2026-10-06, whatever the User-Agent.
    # The per-symbol headline feed (S&P 500, Dow, Nasdaq) still serves market news
    # with a body. It answers 429 to a browser User-Agent, 200 to ours.
    url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=%5EGSPC,%5EDJI,%5EIXIC&region=US&lang=en-US"
    category: "equities"
    tier: 2
    language: "en"
  # The next three publish headlines with no body, so every item scored 0 words
  # against the 8-word gate and none was ever stored. Their article pages answer
  # 403 from the VPS, so extract_content cannot help; the headline is the item,
  # exactly as it is for every "via Google" feed here.
  - name: "Investing.com News"
    # news_25 (stock market) rather than news.rss, whose mix is mostly
    # auto-generated insider-sale filings.
    url: "https://www.investing.com/rss/news_25.rss"
    category: "equities"
    tier: 2
    language: "en"
    min_words: 0
  - name: "Seeking Alpha Market Currents"
    url: "https://seekingalpha.com/market_currents.xml"
    category: "equities"
    tier: 2
    language: "en"
    min_words: 0
  - name: "TipRanks News via Google"
    # site: form — site:tipranks.com returns 0 in Google News; site:tipranks.com/news works.
    url: "https://news.google.com/rss/search?q=when:18h+site:tipranks.com/news&ceid=US:en&hl=en-US&gl=US"
    category: "equities"
    tier: 2
    language: "en"

  # === MACRO & CENTRAL BANKS (tier 1) ===
  - name: "Fed Press Releases"
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    category: "macro_rates"
    tier: 1
    language: "en"
  - name: "Reuters Economy via Google"
    url: "https://news.google.com/rss/search?q=when:24h+site:reuters.com/markets+(Fed+OR+inflation+OR+rates+OR+jobs)&ceid=US:en&hl=en-US&gl=US"
    category: "macro_rates"
    tier: 1
    language: "en"
  - name: "ECB via Google"
    url: "https://news.google.com/rss/search?q=when:24h+(ECB+OR+Lagarde+OR+euro+area+inflation)&ceid=US:en&hl=en-US&gl=US"
    category: "macro_rates"
    tier: 2
    language: "en"

  # === COMMODITIES & ENERGY ===
  - name: "OilPrice.com"
    url: "https://oilprice.com/rss/main"
    category: "commodities_energy"
    tier: 2
    language: "en"

  # === CRYPTO ===
  - name: "CoinDesk"
    url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    category: "crypto"
    tier: 2
    language: "en"
    min_words: 0  # headline only, article pages 403: see Investing.com above
  - name: "Cointelegraph"
    url: "https://cointelegraph.com/rss"
    category: "crypto"
    tier: 2
    language: "en"

  # === GREECE / ATHEX ===
  - name: "Naftemporiki"
    url: "https://www.naftemporiki.gr/feed"
    category: "greece_athex"
    tier: 2
    language: "gr"
  - name: "Capital.gr via Google"
    url: "https://news.google.com/rss/search?q=when:24h+site:capital.gr&ceid=GR:el&hl=el&gl=GR"
    category: "greece_athex"
    tier: 2
    language: "gr"
  - name: "Euro2day via Google"
    url: "https://news.google.com/rss/search?q=when:24h+site:euro2day.gr&ceid=GR:el&hl=el&gl=GR"
    category: "greece_athex"
    tier: 2
    language: "gr"

  # --- Supervision, banking and payments (added 2026-08-15) ---
  # ECB and EBA direct, plus payments trade press: the regulatory and
  # infrastructure side that the market wires do not cover.
  - name: "FT Companies"
    url: "https://www.ft.com/companies?format=rss"
    category: "equities"
    tier: 1
    language: "en"
  - name: "ECB Press"
    url: "https://www.ecb.europa.eu/rss/press.html"
    category: "macro_rates"
    tier: 1
    language: "en"
    # Headline only (median 0 body words, never stored), but its pages load from
    # the VPS, so fetch the body rather than lowering the floor.
    extract_content: true
  - name: "EBA News"
    url: "https://www.eba.europa.eu/rss.xml"
    category: "sectors_themes"
    tier: 1
    language: "en"
  - name: "Finextra"
    url: "https://www.finextra.com/rss/headlines.aspx"
    category: "sectors_themes"
    tier: 2
    language: "en"
