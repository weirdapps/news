newsapi_keywords:
  - keyword: "artificial intelligence"
    category: ai
  - keyword: "machine learning"
    category: ai
  - keyword: "banking technology"
    category: banking
  - keyword: "fintech"
    category: banking
  - keyword: "Greek economy"
    category: greece
  - keyword: "Apple product"
    category: apple
  - keyword: "stock market"
    category: trading

websearch_queries:
  - query: "Greek banking news National Bank"
    category: greece
  - query: "Apple innovation technology"
    category: apple
  - query: "AI banking transformation"
    category: ai
  - query: "European financial markets"
    category: business
