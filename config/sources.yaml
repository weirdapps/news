  # Greece & Local
  - name: "Kathimerini English"
    url: "https://news.google.com/rss/search?q=when:24h+allinurl:ekathimerini.com&ceid=US:en&hl=en&gl=US"
    category: "greece"
    tier: 1
    language: "en"
  - name: "Kathimerini Greek"
    url: "https://news.google.com/rss/search?q=when:24h+allinurl:kathimerini.gr&ceid=GR:el&hl=el&gl=GR"
    category: "greece"
    tier: 1
    language: "gr"
  - name: "Capital.gr"
    url: "https://news.google.com/rss/search?q=when:24h+allinurl:capital.gr&ceid=GR:el&hl=el&gl=GR"
