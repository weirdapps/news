# config/sources.yaml
# News sources organized by type: RSS feeds, NewsAPI keywords, WebSearch queries

rss_feeds:
  # Business & Finance
  - name: "Reuters Business"
    url: "https://news.google.com/rss/search?q=when:24h+allinurl:reuters.com/business&ceid=US:en&hl=en-US&gl=US"
    category: "business"
    tier: 1
    language: "en"
  - name: "Financial Times"
    url: "https://www.ft.com/rss/home"
    category: "business"
    tier: 1
    language: "en"
  - name: "WSJ Markets"
    url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"
    category: "business"
    tier: 1
    language: "en"

  # Investments & Trading
  - name: "Seeking Alpha"
    url: "https://seekingalpha.com/market_currents.xml"
