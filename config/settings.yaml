# Pipeline settings for news reader system

pipeline:
  # Minimum relevance score to include an article
  relevance_threshold: 20

  # Maximum articles per category in final digest
  max_articles_per_category: 8

  # Maximum article age in hours
  max_article_age_hours: 36

  # Minimum article length in words (low for RSS summaries)
  min_article_length_words: 10

  # Hours of articles to include in each digest (from DB)
  digest_window_hours: 48

  # Max articles to send to synthesis (top N by relevance score)
  max_digest_articles: 300

  # Max articles per source to preserve diversity
  max_articles_per_source: 20

  # Number of characters to hash for deduplication
  dedup_hash_chars: 200

email:
  # Primary recipient
  recipient: plessas@nbg.gr

schedule:
  # Timezone for scheduling
  timezone: Europe/Athens

  # Run times (24-hour format) — must match launchd plist (com.news.digest)
  runs:
    - "00:00"
    - "09:00"
    - "13:00"
    - "17:00"
    - "21:00"

storage:
  # SQLite database path
  db_path: ~/SourceCode/news/data/news.db

  # Run log path
  run_log_path: ~/SourceCode/news/data/run.log

  # Archive directory for old articles
  archive_dir: ~/SourceCode/news/data/archive

  # Days before archiving articles
  archive_after_days: 30

synthesis:
  # Claude command path
  claude_command: /Users/plessas/.local/bin/claude

  # Arguments for Claude synthesis
  claude_args:
    - "--print"
    - "--model"
    - "sonnet"

  # Timeout for synthesis in seconds
  timeout: 300

  # Maximum retries on failure
  max_retries: 2

newsapi:
  # NewsAPI base URL
  base_url: https://newsapi.org/v2/everything

  # Page size for NewsAPI requests
  page_size: 20

# Scoring weights and bonuses (flat keys matching processor.py)
scoring:
  # NBG mention bonus
  nbg_mention: 50

  # Greek banking keyword bonus
  greek_banking: 30

  # Claude/AI tools mention bonus
  claude_mention: 25

  # Category match bonus
  category_match: 10

  # Tier bonuses (by source tier)
  tier_1_bonus: 15
  tier_2_bonus: 10
  tier_3_bonus: 5

  # Recency bonuses (by age in hours)
  recency_1h: 15
  recency_4h: 12
  recency_12h: 10
  recency_24h: 5
